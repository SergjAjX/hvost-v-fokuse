name: Update Telegram Posts

on:
  schedule:
    - cron: '0 * * * *' # Запуск каждый час
  workflow_dispatch: # Ручной запуск
  push:
    branches: [ main ]

jobs:
  fetch-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешаем записывать изменения в репозиторий
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Обновленная версия без предупреждений

      - name: Set up Python
        uses: actions/setup-python@v5 # Обновленная версия
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch posts and update JSON
        env:
          CHANNEL: ${{ secrets.CHANNEL }}
        run: python fetch_posts.py

      - name: Commit and push changes safely
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update telegram posts"
          file_pattern: "posts.json"
